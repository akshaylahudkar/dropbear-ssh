<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Dropbear SSH</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <table class="root"><tr><td class="root-cell">

        <div class="title">DROPBEAR SSH</div>

        <div id="state" class="state">Loading...</div>

        <div id="details-section" style="display:none;">
            <div class="section-label">CONNECT</div>
            <div id="details" class="stat-block">Loading...</div>
        </div>

        <button id="toggle-btn" class="toggle-btn" disabled>Loading...</button>

        <label class="keepawake-row" for="keepawake-check">
            <input type="checkbox" id="keepawake-check" disabled>
            <span>Keep reachable while Kindle sleeps</span>
        </label>
        <div class="keepawake-note">Uses more battery — WiFi and CPU stay
            active instead of suspending. The screen itself still costs
            nothing either way.</div>

        <button id="update-btn" class="update-btn" disabled>Check for Update</button>

        <div id="status-line" class="status-line">--</div>

    </td></tr></table>
</body>
</html>
